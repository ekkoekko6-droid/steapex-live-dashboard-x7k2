<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>LIVE Realtime ทุกช่อง</title>
  <link rel="icon" href="data:,">
  <style>
    :root{color-scheme:dark;font-family:Inter,"Noto Sans Thai",system-ui,sans-serif;background:#080b10;color:#f8fafc;
      --card:#111722;--line:#243044;--muted:#94a3b8;--dim:#64748b;--orange:#fb923c;--green:#4ade80;--red:#fca5a5;--amber:#fbbf24}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;padding:24px;background:radial-gradient(circle at 10% 0,#40210c 0,transparent 34%),#080b10}
    main{max-width:1280px;margin:auto}
    .top{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-bottom:18px}
    .eyebrow{color:var(--orange);font-weight:800;letter-spacing:.12em;font-size:12px}
    h1{font-size:clamp(26px,5vw,44px);line-height:1.05;margin:6px 0 4px}
    .sub{color:var(--muted);font-size:14px}
    .sum{display:flex;gap:10px;flex-wrap:wrap}
    .sum div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;min-width:120px}
    .sum b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
    .sum span{font-size:12px;color:var(--muted)}
    .banner{padding:12px 16px;border-radius:14px;margin-bottom:14px;font-size:14px}
    .banner.err{border:1px solid #7f1d1d;background:#2a1115;color:#fecaca}
    .banner.warn{border:1px solid #78350f;background:#2a1d0c;color:#fde68a}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;min-width:0}
    .card.is-live{border-color:#166534;box-shadow:0 0 0 1px #16653455 inset}
    .card.is-off{opacity:.78}
    .head{display:flex;justify-content:space-between;align-items:center;gap:10px}
    .name{font-size:18px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .badge{font-size:12px;font-weight:800;border-radius:999px;padding:5px 10px;border:1px solid;white-space:nowrap}
    .b-live{color:var(--green);border-color:#166534;background:#0b2016}
    .b-ended{color:var(--muted);border-color:#334155}
    .b-stale{color:var(--amber);border-color:#78350f;background:#221806}
    .b-none{color:var(--dim);border-color:#1e293b}
    .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:6px;vertical-align:1px;animation:pulse 1.6s infinite}
    @keyframes pulse{50%{opacity:.35}}
    .gmv{margin:10px 0 12px}
    .gmv .l{font-size:12px;color:var(--muted)}
    .gmv .v{font-size:32px;font-weight:850;font-variant-numeric:tabular-nums}
    .m{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
    .m div{background:#0c1119;border:1px solid #1b2433;border-radius:12px;padding:8px 10px;min-width:0}
    .m span{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .m b{display:block;font-size:17px;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .foot{margin-top:10px;font-size:12px;color:var(--dim);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
    .footer{margin-top:18px;color:var(--dim);font-size:13px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
    @media(max-width:760px){body{padding:16px}.grid{grid-template-columns:1fr}.sum div{flex:1;min-width:0}
      .m{grid-template-columns:repeat(3,minmax(0,1fr))}.gmv .v{font-size:28px}}
    @media(prefers-reduced-motion:reduce){.dot{animation:none}}
  </style>
</head>
<body>
<main>
  <div class="top">
    <div>
      <div class="eyebrow">LIVE REALTIME · ทุกช่อง</div>
      <h1>ยอดไลฟ์ตอนนี้</h1>
      <div class="sub">อัปเดตเองทุก 30 วินาที · ช่องที่ไลฟ์อยู่ขึ้นก่อน เรียงตาม GMV</div>
    </div>
    <div class="sum">
      <div><b id="s-live">—</b><span>ช่องที่ไลฟ์อยู่</span></div>
      <div><b id="s-gmv">—</b><span>GMV รวม (ช่องที่ไลฟ์)</span></div>
      <div><b id="s-view">—</b><span>คนดูตอนนี้รวม</span></div>
    </div>
  </div>
  <div id="banner" class="banner" hidden></div>
  <section id="grid" class="grid" aria-live="polite"></section>
  <div class="footer"><span id="served">API: —</span><span>ข้อมูลจาก TikTok Shop LIVE dashboard · collector เก็บทุก 60 วิ</span></div>
</main>
<script>
const API='https://66-42-59-215.sslip.io/live-test?brand=all';
const REFRESH_MS=30000;
const FRESH_SEC=180;          // ไลฟ์อยู่แต่ข้อมูลไม่ขยับเกิน 3 นาที = collector มีปัญหา → ป้าย "ข้อมูลเก่า"
const COLLECTOR_DOWN_SEC=600; // ทุกช่องเงียบเกิน 10 นาที = collector น่าจะหยุด
// ชื่อที่อ่านง่าย (ชื่อในระบบเป็นตัวใหญ่มีขีดล่าง) — ช่องที่ไม่อยู่ในลิสต์จะแปลงขีดล่างเป็นช่องว่างเอง
const LABELS={STEAPEX:'STEAPEX',COROLLA:'COROLLA',COROLLA_MJ:'COROLLA Mary Jane',MOSSDOOM:'MOSSDOOM',
  BOSTANTENSHOE:'Bostanten Shoe',BOSTANTENSHOE_ARK:'Bostanten Shoe ARK',BOSTANTENBAG:'Bostanten Bag',
  AGEFREE:'AGEFREE',AGEFREE_2:'AGEFREE 2',WESTBRONCO:'West Bronco'};
const money=new Intl.NumberFormat('th-TH',{style:'currency',currency:'THB',maximumFractionDigits:0});
const num=new Intl.NumberFormat('th-TH',{maximumFractionDigits:1});
const $=id=>document.getElementById(id);
const fmt=(v,kind)=>v==null||v===''?'—':kind==='money'?money.format(v):kind==='pct'?`${num.format(v)}%`:num.format(v);
const label=b=>LABELS[b]||String(b||'').replace(/_/g,' ');
const hhmm=iso=>iso?new Date(iso).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}):'';
const ago=s=>s<60?`${s} วิที่แล้ว`:s<3600?`${Math.round(s/60)} นาทีที่แล้ว`:`${Math.round(s/3600)} ชม.ที่แล้ว`;

function state(d){
  if(!d) return 'none';
  if(d.status==='OK') return d.age_sec<=FRESH_SEC?'live':'stale';
  return 'ended';
}
const RANK={live:0,stale:1,ended:2,none:3};

function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}

function card(brand,d){
  const st=state(d), k=(d&&d.kpi)||{};
  const c=el('article',`card ${st==='live'?'is-live':st==='ended'||st==='none'?'is-off':''}`);
  const head=el('div','head');
  head.append(el('div','name',label(brand)));
  const badge=el('span','badge');
  if(st==='live'){badge.className+=' b-live';badge.append(el('span','dot'),'LIVE');}
  else if(st==='stale'){badge.className+=' b-stale';badge.textContent=`ข้อมูลเก่า · ${ago(d.age_sec)}`;}
  else if(st==='ended'){badge.className+=' b-ended';badge.textContent=d.live_ended_at?`ENDED · จบ ${hhmm(d.live_ended_at)}`:'ENDED';}
  else{badge.className+=' b-none';badge.textContent='ยังไม่มีข้อมูล';}
  head.append(badge); c.append(head);
  const g=el('div','gmv'); g.append(el('div','l',st==='ended'?'GMV ไลฟ์ล่าสุด':'GMV สะสมในไลฟ์'),el('div','v',fmt(k.gmv,'money')));
  c.append(g);
  const m=el('div','m');
  [['Orders',k.orders],['AOV',k.aov,'money'],['คนดูตอนนี้',st==='live'||st==='stale'?k.current_viewers:null],
   ['Peak',k.peak_viewers],['CTR',k.ctr,'pct'],['CTOR',k.ctor,'pct'],['Watch GPM',k.watch_gpm,'money']]
   .forEach(([l,v,kind])=>{const x=el('div');x.append(el('span',null,l),el('b',null,fmt(v,kind)));m.append(x);});
  c.append(m);
  if(d){const f=el('div','foot');f.append(el('span',null,`เก็บ ${hhmm(d.collected_at)} (${ago(d.age_sec)})`),el('span',null,`room ${d.room_id||'—'}`));c.append(f);}
  return c;
}

let lastOk=null;
async function load(){
  const banner=$('banner');
  try{
    const r=await fetch(`${API}&t=${Date.now()}`,{cache:'no-store'});
    const data=await r.json();
    if(!r.ok) throw new Error(data.error||`HTTP ${r.status}`);
    const byBrand={}; (data.brands||[]).forEach(d=>{if(d&&d.brand)byBrand[d.brand]=d;});
    const brands=[...new Set([...Object.keys(LABELS),...Object.keys(byBrand)])];
    brands.sort((a,b)=>{const da=byBrand[a],db=byBrand[b];
      return RANK[state(da)]-RANK[state(db)]||((db&&db.kpi&&db.kpi.gmv)||0)-((da&&da.kpi&&da.kpi.gmv)||0)||label(a).localeCompare(label(b));});
    $('grid').replaceChildren(...brands.map(b=>card(b,byBrand[b])));
    const live=brands.map(b=>byBrand[b]).filter(d=>state(d)==='live');
    $('s-live').textContent=`${live.length} / ${brands.length}`;
    $('s-gmv').textContent=money.format(live.reduce((s,d)=>s+((d.kpi&&d.kpi.gmv)||0),0));
    $('s-view').textContent=num.format(live.reduce((s,d)=>s+((d.kpi&&d.kpi.current_viewers)||0),0));
    const ages=Object.values(byBrand).map(d=>d.age_sec).filter(a=>a!=null);
    const newest=ages.length?Math.min(...ages):null;
    if(newest==null||newest>COLLECTOR_DOWN_SEC){
      banner.hidden=false;banner.className='banner warn';
      banner.textContent=newest==null?'ยังไม่มีข้อมูลจาก collector':`collector ไม่ได้ส่งข้อมูลมา ${ago(newest)} — ตัวเก็บข้อมูลบน Mac mini อาจหยุดอยู่`;
    }else banner.hidden=true;
    $('served').textContent=`API: ${new Date(data.served_at).toLocaleTimeString('th-TH')}`;
    lastOk=Date.now();
  }catch(e){
    banner.hidden=false;banner.className='banner err';
    banner.textContent=`เชื่อมต่อ API ไม่สำเร็จ: ${e.message}`+(lastOk?` · ตัวเลขด้านล่างเป็นของ ${new Date(lastOk).toLocaleTimeString('th-TH')}`:'');
  }
}
load(); setInterval(load,REFRESH_MS);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load();});
</script>
</body>
</html>
