<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>STEAPEX Realtime API Test</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,"Noto Sans Thai",system-ui,sans-serif;background:#080b10;color:#f8fafc}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;padding:28px;background:radial-gradient(circle at 10% 0,#40210c 0,transparent 34%),#080b10}
    main{max-width:980px;margin:auto}.top{display:flex;justify-content:space-between;gap:18px;align-items:start;margin-bottom:22px}.eyebrow{color:#fb923c;font-weight:800;letter-spacing:.12em;font-size:12px}.title{font-size:clamp(28px,6vw,54px);line-height:1;margin:8px 0}.sub{color:#94a3b8}.pill{border:1px solid #334155;border-radius:999px;padding:9px 13px;white-space:nowrap}.live{color:#4ade80;border-color:#166534}.offline{color:#fca5a5;border-color:#7f1d1d}
    .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{background:#111722;border:1px solid #243044;border-radius:18px;padding:18px}.label{font-size:12px;color:#94a3b8}.value{font-size:30px;font-weight:850;margin-top:5px}.wide{grid-column:span 2}.footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:18px;color:#64748b;font-size:13px}.error{padding:18px;border:1px solid #7f1d1d;background:#2a1115;border-radius:16px;color:#fecaca}
    @media(max-width:760px){body{padding:18px}.top{display:block}.pill{display:inline-block;margin-top:12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.wide{grid-column:span 2}.value{font-size:25px}}
  </style>
</head>
<body>
<main>
  <div class="top"><div><div class="eyebrow">PROOF OF CONCEPT · GITHUB PAGES + VPS API</div><h1 class="title">STEAPEX LIVE</h1><div class="sub">หน้าทดสอบแยก ไม่กระทบแดชบอร์ดหลัก · หน้าเว็บเช็ก API ทุก 10 วินาที</div></div><div id="status" class="pill">กำลังเชื่อมต่อ…</div></div>
  <div id="error" class="error" hidden></div>
  <section id="cards" class="grid" hidden>
    <div class="card wide"><div class="label">GMV สะสมใน LIVE</div><div id="gmv" class="value">—</div></div>
    <div class="card"><div class="label">Orders</div><div id="orders" class="value">—</div></div>
    <div class="card"><div class="label">AOV</div><div id="aov" class="value">—</div></div>
    <div class="card"><div class="label">คนดูตอนนี้</div><div id="current_viewers" class="value">—</div></div>
    <div class="card"><div class="label">Peak Viewers</div><div id="peak_viewers" class="value">—</div></div>
    <div class="card"><div class="label">LIVE CTR</div><div id="ctr" class="value">—</div></div>
    <div class="card"><div class="label">CTOR</div><div id="ctor" class="value">—</div></div>
    <div class="card"><div class="label">Views</div><div id="views" class="value">—</div></div>
    <div class="card"><div class="label">Watch GPM</div><div id="watch_gpm" class="value">—</div></div>
  </section>
  <div class="footer"><span id="collected">เก็บข้อมูล: —</span><span id="served">API: —</span><span id="latency">เวลาที่ใช้เก็บ: —</span></div>
</main>
<script>
const API='https://66-42-59-215.sslip.io/live-test';
const money=new Intl.NumberFormat('th-TH',{style:'currency',currency:'THB',maximumFractionDigits:0});
const num=new Intl.NumberFormat('th-TH',{maximumFractionDigits:1});
const el=id=>document.getElementById(id);
const show=(id,v,kind='num')=>el(id).textContent=v==null?'—':kind==='money'?money.format(v):kind==='pct'?`${num.format(v)}%`:num.format(v);
async function load(){
  try{
    const response=await fetch(`${API}?t=${Date.now()}`,{cache:'no-store'});
    const data=await response.json();
    if(!response.ok) throw new Error(data.error||`HTTP ${response.status}`);
    el('error').hidden=true; el('cards').hidden=false;
    const live=data.status==='OK'&&!data.stale;
    el('status').className=`pill ${live?'live':'offline'}`;
    el('status').textContent=live?`● LIVE · สด ${data.age_sec} วิ`:`${data.status}${data.stale?' · ข้อมูลเก่า':''}`;
    const k=data.kpi||{};
    show('gmv',k.gmv,'money'); show('orders',k.orders); show('aov',k.aov,'money');
    show('current_viewers',k.current_viewers); show('peak_viewers',k.peak_viewers);
    show('ctr',k.ctr,'pct'); show('ctor',k.ctor,'pct'); show('views',k.views); show('watch_gpm',k.watch_gpm,'money');
    el('collected').textContent=`เก็บข้อมูล: ${new Date(data.collected_at).toLocaleString('th-TH')}`;
    el('served').textContent=`API: ${new Date(data.served_at).toLocaleTimeString('th-TH')}`;
    el('latency').textContent=`เวลาที่ใช้เก็บ: ${data.duration_sec} วินาที`;
  }catch(error){
    el('cards').hidden=true; el('error').hidden=false; el('error').textContent=`เชื่อมต่อ API ไม่สำเร็จ: ${error.message}`;
    el('status').className='pill offline'; el('status').textContent='API ERROR';
  }
}
load(); setInterval(load,10000);
</script>
</body>
</html>
